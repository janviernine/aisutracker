<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>aisuchu — Days Since Last Live</title>
<meta name="color-scheme" content="dark">
<style>
  :root{
    --bg:#000;
    --text:#ffffff;
    --muted:#a8a8a8;
    --border:#2a2a2a;
    --line:#242424;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    min-height:100vh; min-height:100dvh;
    overflow:auto;
    background:var(--bg);
    color:var(--text);
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
    display:flex; align-items:center; justify-content:center;
    padding:24px;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{width:min(520px,100%); display:flex; flex-direction:column; justify-content:center; padding:24px 0;}
  .top{
    display:flex; align-items:center; justify-content:center; gap:8px; flex-wrap:wrap;
    margin:0 auto 20px; width:100%; text-align:center;
    color:var(--muted); font-size:10px; letter-spacing:.14em; text-transform:uppercase;
    opacity:.85;
  }
  .top a{color:var(--muted); text-decoration:none; border-bottom:1px solid #2a2a2a}
  .top a:hover{color:var(--text)}
  .card{
    background:transparent;
    border:none;
    border-radius:0;
    overflow:visible;
    box-shadow:none;
  }
  .header{
    display:flex; flex-direction:column; align-items:center; gap:10px;
    padding:0 0 28px;
    border:none;
    background:transparent;
    text-align:center;
  }
  .avatar{
    width:44px; height:44px; border-radius:50%; flex-shrink:0;
    border:1px solid var(--border);
    background:#111;
    object-fit:cover;
    filter:grayscale(100%);
    opacity:1;
  }
  .meta{flex:none; min-width:0; text-align:center}
  .name-row{display:flex; align-items:center; justify-content:center; gap:8px; flex-wrap:wrap}
  .name{font-weight:500; font-size:13px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted)}
  .badge{
    font-size:10px; font-weight:500; letter-spacing:.12em; text-transform:uppercase;
    padding:4px 8px; border-radius:999px; border:1px solid var(--border);
    background:transparent; color:var(--muted);
  }
  .badge.live{
    background:var(--text); border-color:var(--text); color:var(--bg);
    box-shadow:none;
    animation:none;
  }
  .handle{color:var(--muted); font-size:12px; margin-top:2px; opacity:.85}
  .handle a{color:var(--muted); text-decoration:none}
  .handle a:hover{color:var(--text)}
  .body{padding:0; text-align:center}
  .label{
    font-size:10px; letter-spacing:.18em; text-transform:uppercase; color:var(--muted); font-weight:500; opacity:1;
  }
  .days{
    font-size: clamp(72px, 18vw, 112px);
    font-weight:200;
    letter-spacing:-.06em;
    line-height:1;
    margin:10px 0 0;
    background:none; -webkit-text-fill-color:var(--text); background-clip:border-box;
    display:inline-flex; align-items:baseline; justify-content:center; gap:.14em;
  }
  .days small{font-size:.28em; letter-spacing:.04em; font-weight:400; opacity:.7; -webkit-text-fill-color:var(--muted); margin-left:0}
  .days.live-now{
    background:none; -webkit-text-fill-color:var(--text);
    text-shadow:none;
    font-size: clamp(44px, 12vw, 64px);
    font-weight:200;
  }
  .sub{color:var(--muted); font-size:13px; margin-top:10px; line-height:1.5; min-height:1.2em; opacity:.95}
  .sub strong{color:var(--text); font-weight:500}
  .grid{
    display:grid; grid-template-columns:1fr 1fr; gap:0;
    margin-top:36px; text-align:left;
    border-top:1px solid var(--line);
    padding-top:20px;
  }
  @media (max-width:520px){ .grid{grid-template-columns:1fr; gap:16px} }
  .stat{
    background:transparent;
    border:none;
    border-radius:0;
    padding:0 16px;
    border-right:1px solid var(--line);
  }
  .stat:last-child{border-right:none}
  @media (max-width:520px){ .stat{border-right:none; border-bottom:1px solid var(--line); padding:0 0 16px} .stat:last-child{border-bottom:none; padding-bottom:0} }
  .stat .k{font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); font-weight:500; opacity:.9}
  .stat .v{margin-top:6px; font-size:13px; font-weight:500; line-height:1.4; word-break:break-word; color:var(--text)}
  .stat .v.muted{color:var(--muted); font-weight:400; opacity:.8}
  .actions{display:flex; gap:8px; justify-content:center; margin-top:28px; flex-wrap:wrap}
  .btn{
    appearance:none; border:1px solid var(--line); background:transparent; color:var(--text);
    padding:8px 14px; border-radius:999px; font-weight:400; font-size:12px; cursor:pointer;
    display:inline-flex; align-items:center; gap:6px;
    transition:.15s; opacity:.7;
  }
  .btn:hover{border-color:#333; background:transparent; transform:none; opacity:1}
  .btn.primary{background:var(--text); border-color:var(--text); color:var(--bg); opacity:1}
  .btn.primary:hover{background:#fff; border-color:#fff}
  .mono{font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size:11px}
  .error{
    margin-top:16px; background:transparent; border:1px solid #222;
    color:var(--muted); padding:10px 12px; border-radius:8px; font-size:12px; display:none; text-align:left;
  }
  .error.show{display:block}

  .hiatus{margin-top:28px; border-top:1px solid var(--line); padding-top:20px}
  .hiatus-head{display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:14px}
  .hiatus-title{font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); font-weight:500; opacity:.9}
  .hiatus-count{font-size:10px; color:var(--muted); opacity:.6}
  .hiatus-list{display:flex; flex-direction:column; gap:8px}
  .hiatus-row{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:10px 12px; border:1px solid var(--line); border-radius:10px; background:transparent}
  .hiatus-row.record{border-color:var(--line); background:transparent}
  .hiatus-left{display:flex; flex-direction:column; gap:2px; min-width:0}
  .hiatus-label{font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); font-weight:500}
  .hiatus-dates{font-size:12px; color:var(--text); font-weight:400; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .hiatus-right{display:flex; align-items:center; gap:8px; flex-shrink:0}
  .hiatus-days{font-size:13px; font-weight:600; color:var(--text); letter-spacing:-.02em}
  .hiatus-badge{font-size:9px; letter-spacing:.1em; text-transform:uppercase; padding:4px 8px; border-radius:999px; background: linear-gradient(90deg, #b8932f 0%, #ffd700 25%, #ffec8b 50%, #ffd700 75%, #b8932f 100%); background-size:220% 100%; color:#1a1200; font-weight:700; border:1px solid #d4af37; box-shadow:0 0 10px rgba(255,215,0,.35); animation: goldShimmer 2.2s infinite linear; position:relative; overflow:hidden}
  @keyframes goldShimmer{0%{background-position:-120% 0} 100%{background-position:120% 0}}
  .hiatus-badge::after{content:""; position:absolute; top:0; left:-60%; width:60%; height:100%; background:linear-gradient(120deg, transparent 20%, rgba(255,255,255,.7) 40%, transparent 60%); transform:skewX(-12deg); animation: goldGlisten 2.8s infinite ease-in-out}
  @keyframes goldGlisten{0%{left:-60%} 50%{left:100%} 100%{left:100%}}

</style>
</head>
<body>
  <div class="wrap">
    <div class="card" id="card">
      <div class="header">
        <img id="avatar" class="avatar" src="https://static-cdn.jtvnw.net/jtv_user_pictures/6afb1af2-1870-49b9-ad4c-fba3ffb2275e-profile_image-300x300.png" alt="aisuchu avatar" onerror="this.style.display='none'">
        <div class="meta">
          <div class="name-row">
            <div class="name" id="displayName">aisuchu</div>
            <div class="badge" id="badge">checking…</div>
          </div>
          <div class="handle"><a href="https://twitch.tv/aisuchu" target="_blank" rel="noopener">twitch.tv/aisuchu</a> <span id="handleExtra"></span></div>
        </div>
      </div>

      <div class="body">
        <div class="label" id="label">Days since last live</div>
        <div class="days" id="days">—</div>
        <div class="sub" id="subtitle">Loading last broadcast…</div>

        <div class="grid" style="grid-template-columns:1fr 1fr">
          <div class="stat">
            <div class="k">Last live</div>
            <div class="v" id="ist">—</div>
          </div>
          <div class="stat">
            <div class="k">Exact elapsed duration</div>
            <div class="v" id="exact">—</div>
          </div>
        </div>

        <div class="error" id="error"></div>
      </div>
    </div>
    <div class="hiatus" id="hiatus">
      <div class="hiatus-head">
        <div class="hiatus-title">Hiatus history</div>
        <div class="hiatus-count" id="hiatusCount">—</div>
      </div>
      <div class="hiatus-list" id="hiatusList"></div>
    </div>
  </div>

<script>
const LOGIN = "aisuchu";
const GQL_URL = "https://gql.twitch.tv/gql";
const GQL_CLIENT_ID = "kimne78kx3ncx6brgo4mv6wki5h1ko";
const REFRESH_MS = 5 * 60 * 1000;

const el = {
  days: document.getElementById("days"),
  label: document.getElementById("label"),
  subtitle: document.getElementById("subtitle"),
  badge: document.getElementById("badge"),
  ist: document.getElementById("ist"),
  utc: document.getElementById("utc"),
  exact: document.getElementById("exact"),
  error: document.getElementById("error"),
  dot: document.getElementById("dot"),
  statusText: document.getElementById("statusText"),
  updated: document.getElementById("updated"),
  avatar: document.getElementById("avatar"),
  displayName: document.getElementById("displayName"),
  refreshBtn: document.getElementById("refreshBtn"),
};

function fmtIST(date){
  return date.toLocaleString("en-IN", { timeZone:"Asia/Kolkata", weekday:"short", year:"numeric", month:"short", day:"2-digit", hour:"2-digit", minute:"2-digit", second:"2-digit", hour12:true }) + " IST";
}
function fmtLocal(date){
  try{
    // DD MMM YYYY, hh:mm A  (e.g. 08 Aug 2026, 11:23 AM) in viewer's local timezone, no seconds/tz clutter
    const s = date.toLocaleString("en-GB", { day:"2-digit", month:"short", year:"numeric", hour:"2-digit", minute:"2-digit", hour12:true });
    // en-GB gives "08 Aug 2026, 11:23 am" -> uppercase AM/PM and ensure comma spacing
    return s.replace(/\b(am|pm)\b/i, m => m.toUpperCase());
  } catch(e){
    return date.toLocaleString();
  }
}
function fmtUTC(date){
  return date.toISOString().replace("T"," ").replace("Z"," UTC");
}
function elapsedParts(ms){
  const s = Math.floor(ms/1000);
  const d = Math.floor(s/86400);
  const h = Math.floor((s%86400)/3600);
  const m = Math.floor((s%3600)/60);
  return {d,h,m, s: s%60, totalDays: ms/86400000 };
}
function plural(n, w){ return `${n} ${w}${n!==1?"s":""}`; }

async function fetchGQL(){
  const body = JSON.stringify({
    query: "query { user(login: \""+LOGIN+"\") { login displayName profileImageURL(width: 300) stream { id type createdAt } lastBroadcast { startedAt } } }"
  });
  const res = await fetch(GQL_URL, {
    method:"POST",
    headers:{ "Client-ID": GQL_CLIENT_ID, "Content-Type":"application/json" },
    body
  });
  if(!res.ok) throw new Error(`GQL HTTP ${res.status} ${res.statusText}`);
  const json = await res.json();
  if(json.errors) throw new Error(json.errors.map(e=>e.message).join("; "));
  if(!json.data || !json.data.user) throw new Error("Channel not found: " + LOGIN);
  return json.data.user;
}

function render(user){
  const now = new Date();
  const isLive = !!user.stream;
  const startedAt = user.lastBroadcast && user.lastBroadcast.startedAt ? new Date(user.lastBroadcast.startedAt) : null;

  // header
  el.displayName.textContent = user.displayName || user.login || LOGIN;
  if(user.profileImageURL) el.avatar.src = user.profileImageURL;

  if(isLive){
    el.badge.textContent = "● LIVE NOW";
    el.badge.className = "badge live";
    el.label.textContent = "Currently live";
    el.days.className = "days live-now";
    el.days.textContent = "LIVE";
    el.subtitle.style.display = "";
    const liveSince = user.stream.createdAt ? new Date(user.stream.createdAt) : null;
    const liveFor = liveSince ? elapsedParts(now - liveSince) : null;
    el.subtitle.innerHTML = liveFor
      ? `Streaming right now — live for <strong>${plural(liveFor.h, "hour")}, ${plural(liveFor.m, "min")}</strong>. Days counter paused at <strong>0</strong>.`
      : `Streaming right now on <strong>twitch.tv/${LOGIN}</strong> — days counter is <strong>0</strong>.`;
    // still show lastBroadcast underneath
    if(startedAt){
      el.ist.textContent = fmtLocal(startedAt) + " (this stream)";
      if(el.utc) el.utc.textContent = fmtUTC(startedAt);
      el.exact.textContent = "Live — started " + fmtLocal(startedAt);
    } else {
      el.ist.textContent = "— (no prior broadcast found)";
      if(el.utc) el.utc.textContent = "—";
      el.exact.textContent = "Live now";
    }
  } else {
    el.badge.textContent = "offline";
    el.badge.className = "badge";
    el.label.textContent = "Days since last live";

    if(!startedAt){
      el.days.textContent = "—";
      el.days.className = "days";
      el.subtitle.style.display = "";
      el.subtitle.textContent = "No last broadcast found for this channel.";
      el.ist.textContent = "—";
      if(el.utc) el.utc.textContent = "—";
      el.exact.textContent = "—";
    } else {
      const diffMs = now - startedAt;
      const p = elapsedParts(diffMs);
      const daysFloor = Math.floor(diffMs / 86400000);
      const daysText = String(daysFloor);

      el.days.className = "days";
      el.days.innerHTML = `${daysText}<small>day${daysFloor===1?"":"s"}</small>`;

      // subtitle - don't duplicate big number; show time detail instead
      if(daysFloor === 0) { el.subtitle.style.display = ""; el.subtitle.innerHTML = `Last live <strong>today</strong> — ${plural(p.h,"hour")} ago`; }
      else if(daysFloor === 1) { el.subtitle.style.display = ""; el.subtitle.innerHTML = `Last live <strong>yesterday</strong>`; }
      else { el.subtitle.style.display = "none"; el.subtitle.innerHTML = ""; }

      el.ist.textContent = fmtLocal(startedAt);
      if(el.utc) el.utc.textContent = fmtUTC(startedAt);
      el.exact.textContent = `${plural(p.d,"day")}, ${plural(p.h,"hour")}, ${plural(p.m,"min")} ago`;
    }
  }

  el.dot && (el.dot.className = "dot");
  if(el.statusText) el.statusText.textContent = isLive ? "live" : "offline — updated";
  if(el.updated) el.updated.textContent = "· " + now.toLocaleTimeString("en-IN", {timeZone:"Asia/Kolkata", hour:"2-digit", minute:"2-digit", second:"2-digit"}) + " IST";
  el.error.classList.remove("show");
  el.error.textContent = "";
}

async function load(){
  if(el.statusText) el.statusText.textContent = "fetching…";
  if(el.dot) el.dot.className = "dot";
  el.error.classList.remove("show");
  if(el.refreshBtn) el.refreshBtn.disabled = true;
  try{
    const user = await fetchGQL();
    render(user);
  } catch(e){
    console.error(e);
    el.days.textContent = "—";
    el.subtitle.textContent = "Could not fetch Twitch data.";
    if(el.dot) el.dot.className = "dot err";
    if(el.statusText) el.statusText.textContent = "error";
    el.error.textContent = "Fetch failed: " + (e.message || e) + " — Twitch GQL may be rate-limited or CORS-blocked if you opened the file via file:// in some browsers. Try opening via http:// (or tell me and I’ll add a CORS proxy fallback).";
    el.error.classList.add("show");
    el.ist.textContent = "—";
    if(el.utc) el.utc.textContent = "—";
    el.exact.textContent = "—";
    el.badge.textContent = "error";
  } finally {
    if(el.refreshBtn) el.refreshBtn.disabled = false;
  }
}

if(el.refreshBtn) el.refreshBtn.addEventListener("click", load);
const _copy = document.getElementById("copyLink");
if(_copy) _copy.addEventListener("click", (e)=>{
  e.preventDefault();
  const t = el.days.textContent.trim() + " — " + el.subtitle.textContent.replace(/<[^>]*>/g,"") + " (twitch.tv/aisuchu)";
  navigator.clipboard.writeText(t).then(()=>{
    const a = e.target; const old=a.textContent; a.textContent="copied!"; setTimeout(()=>a.textContent=old,1200);
  });
});

// --- MOCK HIATUS DATA (for visual test, will be replaced by real log) ---
const MOCK_HIATUS = [
  { start: "2026-08-01", end: "2026-08-26", days: 25 },
  { start: "2026-09-01", end: "2026-09-29", days: 28 },
  { start: "2026-10-05", end: "2026-10-18", days: 13 },
  { start: "2026-11-02", end: "2026-11-25", days: 23 },
];

function fmtHiatusDate(iso){
  const d = new Date(iso + "T12:00:00");
  // DD MMM YYYY in local, same style as Last live
  const s = d.toLocaleString("en-GB", { day:"2-digit", month:"short", year:"numeric" });
  return s;
}

function renderHiatus(list){
  const wrap = document.getElementById("hiatus");
  const listEl = document.getElementById("hiatusList");
  const countEl = document.getElementById("hiatusCount");
  if(!wrap || !listEl) return;
  if(!list || list.length===0){ countEl.textContent="no hiatuses yet"; listEl.innerHTML='<div style="color:var(--muted);font-size:12px;opacity:.6">No gaps logged yet.</div>'; return; }
  const maxDays = Math.max(...list.map(h=>h.days));
  countEl.textContent = list.length + " hiatuses";
  listEl.innerHTML = list.map((h,i)=>{
    const isRecord = h.days === maxDays && list.length>1;
    const start = fmtHiatusDate(h.start);
    const end = fmtHiatusDate(h.end);
    return `<div class="hiatus-row ${isRecord?"record":""}">
      <div class="hiatus-left">
        <div class="hiatus-label">Hiatus ${i+1}</div>
        <div class="hiatus-dates">${start} → ${end}</div>
      </div>
      <div class="hiatus-right">
        <div class="hiatus-days">${h.days} DAYS</div>
        ${isRecord?'<span class="hiatus-badge">Personal Record</span>':''}
      </div>
    </div>`;
  }).join("");
}

// render mock on load
renderHiatus(MOCK_HIATUS);

load();
setInterval(load, REFRESH_MS);

// also tick the "exact elapsed" every 30s without refetching, so it feels live
setInterval(()=>{
  const istText = el.ist.textContent;
  if(istText && istText !== "—" && !el.badge.classList.contains("live")){
    // re-parse from displayed IST is messy — just refetch is cheap; skip tick if live
  }
}, 30000);
</script>
</body>
</html>
